version: 2.1

parameters:
  run_version_bump:
    type: boolean
    default: false
  version_type:
    type: string
    default: "minor"

executors:
  ubuntu-machine:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    environment:
      RUST_TOOLCHAIN: "stable"
      RUST_LOG: "clash_lib=TRACE"
      RUSTC_BOOTSTRAP: "1"
      DEBIAN_FRONTEND: "noninteractive"
      NEEDRESTART_MODE: "a"

  windows-machine:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    environment:
      RUSTC_BOOTSTRAP: "1"

  macos-machine:
    macos:
      xcode: "15.4.0"
    resource_class: macos.m1.medium.gen1
    environment:
      RUSTC_BOOTSTRAP: "1"

commands:
  setup-rust:
    description: "Install Rust stable toolchain on Unix"
    steps:
      - run:
          name: "Install Rust"
          command: |
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            else
              rustup default stable
              rustup update stable
            fi
            if [ -f "$HOME/.cargo/env" ]; then
              source "$HOME/.cargo/env"
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            rustup component add clippy rustfmt
            rustc --version
            cargo --version

  setup-rust-windows:
    description: "Setup Rust and tools on Windows"
    steps:
      - run:
          name: "Install Rust and NASM"
          command: |
            choco install -y nasm
            rustup default stable
            rustup update stable
            rustup component add clippy
            rustc --version
            cargo --version

  setup-cross:
    description: "Install cross cross-compilation tool"
    steps:
      - run:
          name: "Install cross"
          command: |
            if ! command -v cross >/dev/null 2>&1; then
              echo "Downloading cross binary..."
              curl -sSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar xzf - -C /usr/local/bin
            fi
            cross --version

  install-system-packages:
    description: "Install system packages non-interactively without prompt hanging"
    parameters:
      packages:
        type: string
    steps:
      - run:
          name: "Install system dependencies: << parameters.packages >>"
          command: |
            sudo mkdir -p /etc/needrestart/conf.d
            echo '$nrconf{restart} = "a";' | sudo tee /etc/needrestart/conf.d/no-prompt.conf >/dev/null 2>&1 || true
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends << parameters.packages >>

  restore-cargo-cache:
    steps:
      - restore_cache:
          keys:
            - cargo-cache-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-cache-v1-{{ arch }}-

  save-cargo-cache:
    steps:
      - save_cache:
          key: cargo-cache-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

jobs:
  # Linux PR Check
  check-linux:
    executor: ubuntu-machine
    steps:
      - checkout
      - setup-rust
      - restore-cargo-cache
      - install-system-packages:
          packages: "cmake libclang-dev protobuf-compiler iperf3 iproute2"
      - run:
          name: "Clippy lint checks"
          command: cargo clippy --workspace --all-features
      - run:
          name: "Run workspace tests"
          command: |
            export CLASH_RS_CI=true
            cargo test --workspace --exclude clash-ffi
      - run:
          name: "Build clash-rs release binary"
          command: cargo build --release --bin clash-rs -F "plus"
      - store_artifacts:
          path: target/release/clash-rs
          destination: clash-rs-linux-amd64
      - save-cargo-cache

  # Windows PR Check
  check-windows:
    executor: windows-machine
    steps:
      - checkout
      - setup-rust-windows
      - run:
          name: "Clippy lint checks (Windows)"
          command: cargo clippy --workspace --exclude clash-ffi -F "plus"
      - run:
          name: "Run workspace tests (Windows)"
          command: |
            $env:CLASH_RS_CI = "true"
            cargo test --workspace --exclude clash-ffi -F "plus"
      - run:
          name: "Build clash-rs release binary (Windows)"
          command: cargo build --release --bin clash-rs -F "plus"
      - store_artifacts:
          path: target/release/clash-rs.exe
          destination: clash-rs-windows-amd64.exe

  # macOS PR Check
  check-macos:
    executor: macos-machine
    steps:
      - checkout
      - setup-rust
      - run:
          name: "Clippy lint checks (macOS)"
          command: cargo clippy --workspace --exclude clash-ffi -F "plus"
      - run:
          name: "Run workspace tests (macOS)"
          command: |
            export CLASH_RS_CI=true
            cargo test --workspace --exclude clash-ffi -F "plus"
      - run:
          name: "Build clash-rs release binary (macOS)"
          command: cargo build --release --bin clash-rs -F "plus"
      - store_artifacts:
          path: target/release/clash-rs
          destination: clash-rs-macos-arm64

  # Proxy E2E Throughput (Ubuntu Docker)
  proxy-throughput:
    executor: ubuntu-machine
    environment:
      THROUGHPUT_RESULTS_FILE: "/tmp/throughput-results.json"
      RUST_LOG: "clash_lib=info"
    steps:
      - checkout
      - setup-rust
      - restore-cargo-cache
      - install-system-packages:
          packages: "cmake libclang-dev protobuf-compiler"
      - run:
          name: "Build clash-rs release binary"
          command: cargo build --release --bin clash-rs
      - run:
          name: "Pull test server docker images"
          command: |
            docker pull teddysun/shadowsocks-rust:alpine-1.22.0
            docker pull gists/simple-obfs:latest
            docker pull ghcr.io/ihciah/shadow-tls:latest
            docker pull v2fly/v2fly-core:v4.45.2
            docker pull p4gefau1t/trojan-go:latest
            docker pull teddysun/xray:26.3.27
            docker pull ghcr.io/sagernet/sing-box:v1.13.8
            docker pull tobyxdd/hysteria:latest
            docker pull ghcr.io/itsusinn/tuic-server:latest
            docker pull ghcr.io/spongebob888/shadowquic:latest
            docker pull docker.io/linuxserver/openssh-server:latest
            docker pull nicolaka/netshoot:latest
      - run:
          name: "Download Country.mmdb"
          command: |
            mkdir -p clash-bin/tests/data/config
            curl -fL https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb \
              -o clash-bin/tests/data/config/Country.mmdb
      - run:
          name: "Run proxy throughput tests"
          command: |
            set -o pipefail
            export CLASH_RS_CI="true"
            RUSTFLAGS="--cfg docker_test --cfg throughput_test" \
            cargo test -p clash-lib --release --all-features \
              e2e_throughput \
              -- --test-threads=4 --nocapture 2>&1 | tee throughput-test.log
      - run:
          name: "Format throughput results"
          when: always
          command: |
            ENV_JSON=$(python3 bench/collect_env.py)
            if [ -f "$THROUGHPUT_RESULTS_FILE" ]; then
              python3 bench/format_throughput.py \
                "$THROUGHPUT_RESULTS_FILE" \
                --output throughput-comment.md \
                --run-url "${CIRCLE_BUILD_URL:-}" \
                --env-json "$ENV_JSON"
            fi
      - run:
          name: "Post PR comment"
          when: always
          command: |
            if [ -f throughput-comment.md ]; then
              python3 scripts/ci/post_pr_comment.py \
                --comment-file throughput-comment.md \
                --identifier "Proxy Throughput Results"
            fi
      - store_artifacts:
          path: /tmp/throughput-results.json
          destination: throughput-results.json
      - store_artifacts:
          path: throughput-comment.md
          destination: throughput-comment.md
      - store_artifacts:
          path: throughput-test.log
          destination: throughput-test.log

  # TUN Throughput Benchmark (Ubuntu Root + Netns)
  tun-benchmark:
    executor: ubuntu-machine
    steps:
      - checkout
      - setup-rust
      - restore-cargo-cache
      - install-system-packages:
          packages: "iperf3 iproute2 cmake libclang-dev"
      - run:
          name: "Setup TUN device"
          command: |
            sudo modprobe tun
            ls -la /dev/net/tun
            sudo ip netns del benchns 2>/dev/null || true
            sudo ip link del veth0 2>/dev/null || true
            sudo ip link del clash-bench 2>/dev/null || true
            sudo pkill -9 iperf3 2>/dev/null || true
            sudo pkill -9 clash-rs 2>/dev/null || true
      - run:
          name: "Build clash-rs release binary"
          command: cargo build --release --bin clash-rs --all-features
      - run:
          name: "Run TUN benchmark"
          command: |
            export CLASH_BINARY="$PWD/target/release/clash-rs"
            sudo python3 bench/run_tun_benchmark.py \
              --config bench/tun-benchmark.yaml \
              --duration 10 \
              --output benchmark-pr.json
      - run:
          name: "Compare benchmark results"
          when: always
          command: |
            if [ -f "bench/baseline-tun-benchmark.json" ] && [ -f "benchmark-pr.json" ]; then
              python3 bench/compare_results.py \
                --current benchmark-pr.json \
                --baseline bench/baseline-tun-benchmark.json \
                --output benchmark-comment.md
            fi
      - run:
          name: "Post benchmark comment"
          when: always
          command: |
            if [ -f benchmark-comment.md ]; then
              python3 scripts/ci/post_pr_comment.py \
                --comment-file benchmark-comment.md \
                --identifier "TUN Throughput Benchmark Results"
            fi
      - store_artifacts:
          path: benchmark-pr.json
          destination: benchmark-pr.json
      - store_artifacts:
          path: benchmark-comment.md
          destination: benchmark-comment.md
      - store_artifacts:
          path: clash-rs-bench.log
          destination: clash-rs-bench.log

  # Coverage Linux (1:1 with coverage.yml ubuntu-latest)
  coverage-linux:
    executor: ubuntu-machine
    steps:
      - checkout
      - setup-rust
      - restore-cargo-cache
      - install-system-packages:
          packages: "cmake libclang-dev protobuf-compiler"
      - run:
          name: "Install cargo-llvm-cov"
          command: |
            if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
              echo "Downloading cargo-llvm-cov..."
              curl -sSL https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz | sudo tar xzf - -C /usr/local/bin
            fi
            cargo llvm-cov --version
      - run:
          name: "Run coverage collection (Linux)"
          command: |
            export CLASH_RS_CI="true"
            export CLASH_DOCKER_TEST="true"
            export CROSS_CONTAINER_OPTS="--network host"
            export RUST_LOG="ts_control=debug,ts_runtime=debug,tailscale=debug"
            cargo llvm-cov --workspace --exclude clash-ffi -F "plus" --codecov --output-path codecov-linux.json
      - run:
          name: "Upload to Codecov"
          when: always
          command: |
            if [ -f codecov-linux.json ] && [ -n "${CODECOV_TOKEN:-}" ]; then
              curl -Os https://cli.codecov.io/latest/linux/codecov
              chmod +x codecov
              ./codecov upload-process --token "$CODECOV_TOKEN" -f codecov-linux.json || true
            fi
      - store_artifacts:
          path: codecov-linux.json
          destination: codecov-linux.json

  # Coverage macOS (1:1 with coverage.yml macos-latest)
  coverage-macos:
    executor: macos-machine
    steps:
      - checkout
      - setup-rust
      - run:
          name: "Install cargo-llvm-cov (macOS)"
          command: |
            curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-installer.sh | sh
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
      - run:
          name: "Run coverage collection (macOS)"
          command: |
            export CLASH_RS_CI="true"
            export CLASH_DOCKER_TEST="false"
            export RUST_LOG="ts_control=debug,ts_runtime=debug,tailscale=debug"
            cargo llvm-cov --workspace --exclude clash-ffi -F "plus" --codecov --output-path codecov-macos.json
      - run:
          name: "Upload to Codecov (macOS)"
          when: always
          command: |
            if [ -f codecov-macos.json ] && [ -n "${CODECOV_TOKEN:-}" ]; then
              curl -Os https://cli.codecov.io/latest/macos/codecov
              chmod +x codecov
              ./codecov upload-process --token "$CODECOV_TOKEN" -f codecov-macos.json || true
            fi
      - store_artifacts:
          path: codecov-macos.json
          destination: codecov-macos.json

  # Coverage Windows (1:1 with coverage.yml windows-latest)
  coverage-windows:
    executor: windows-machine
    steps:
      - checkout
      - setup-rust-windows
      - run:
          name: "Install cargo-llvm-cov (Windows)"
          command: |
            Invoke-WebRequest -Uri "https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-pc-windows-msvc.zip" -OutFile "cargo-llvm-cov.zip"
            Expand-Archive -Path "cargo-llvm-cov.zip" -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force
            cargo llvm-cov --version
      - run:
          name: "Run coverage collection (Windows)"
          command: |
            $env:CLASH_RS_CI = "true"
            $env:CLASH_DOCKER_TEST = "false"
            $env:RUST_LOG = "ts_control=debug,ts_runtime=debug,tailscale=debug"
            cargo llvm-cov --workspace --exclude clash-ffi -F "plus" --codecov --output-path codecov-windows.json
      - run:
          name: "Upload to Codecov (Windows)"
          when: always
          command: |
            if (Test-Path "codecov-windows.json" -and $env:CODECOV_TOKEN) {
              Invoke-WebRequest -Uri "https://cli.codecov.io/latest/windows/codecov.exe" -OutFile "codecov.exe"
              .\codecov.exe upload-process --token "$env:CODECOV_TOKEN" -f "codecov-windows.json"
            }
      - store_artifacts:
          path: codecov-windows.json
          destination: codecov-windows.json

  # Release Build Jobs across all 25 targets
  build-linux:
    executor: ubuntu-machine
    parameters:
      target_name:
        type: string
    steps:
      - checkout
      - setup-rust
      - setup-cross
      - restore-cargo-cache
      - run:
          name: "Build << parameters.target_name >>"
          command: python3 scripts/ci/build.py --target-name << parameters.target_name >>
      - persist_to_workspace:
          root: dist
          paths:
            - "*"
      - store_artifacts:
          path: dist
          destination: dist

  build-windows:
    executor: windows-machine
    parameters:
      target_name:
        type: string
    steps:
      - checkout
      - setup-rust-windows
      - run:
          name: "Build << parameters.target_name >>"
          command: python scripts/ci/build.py --target-name << parameters.target_name >>
      - persist_to_workspace:
          root: dist
          paths:
            - "*"
      - store_artifacts:
          path: dist
          destination: dist

  build-macos:
    executor: macos-machine
    parameters:
      target_name:
        type: string
    steps:
      - checkout
      - setup-rust
      - run:
          name: "Build << parameters.target_name >>"
          command: python3 scripts/ci/build.py --target-name << parameters.target_name >>
      - persist_to_workspace:
          root: dist
          paths:
            - "*"
      - store_artifacts:
          path: dist
          destination: dist

  publish-release:
    executor: ubuntu-machine
    steps:
      - checkout
      - attach_workspace:
          at: dist
      - run:
          name: "Install git-cliff"
          command: |
            curl -sSL https://github.com/orhun/git-cliff/releases/latest/download/git-cliff-x86_64-unknown-linux-musl.tar.gz | sudo tar xzf - --strip-components=1 -C /usr/local/bin git-cliff
      - run:
          name: "Publish GitHub Release"
          command: python3 scripts/ci/publish_release.py
      - store_artifacts:
          path: dist
          destination: release-assets

  publish-docker:
    executor: ubuntu-machine
    steps:
      - checkout
      - attach_workspace:
          at: dist
      - run:
          name: "Build and Push Multi-Arch Docker Image"
          command: bash scripts/ci/docker-publish.sh

  bump-version:
    executor: ubuntu-machine
    steps:
      - checkout
      - setup-rust
      - run:
          name: "Configure Git"
          command: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
      - run:
          name: "Install cargo-edit"
          command: cargo install cargo-edit
      - run:
          name: "Bump version"
          command: cargo set-version --bump << pipeline.parameters.version_type >>
      - run:
          name: "Commit, tag and push"
          command: |
            VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "clash-rs") | .version')
            echo "New version: v$VERSION"
            git add Cargo.toml clash-bin/Cargo.toml clash-dns/Cargo.toml clash-doc/Cargo.toml clash-ffi/Cargo.toml clash-lib/Cargo.toml clash-netstack/Cargo.toml Cargo.lock
            git commit -m "chore: bump version to v$VERSION"
            git tag "v$VERSION"
            git push origin master
            git push origin "v$VERSION"

workflows:
  pr-pipeline:
    unless: << pipeline.parameters.run_version_bump >>
    jobs:
      # Cross-platform tests: Linux, Windows, macOS
      - check-linux:
          filters:
            tags:
              ignore: /^v.*/
      - check-windows:
          filters:
            tags:
              ignore: /^v.*/
      - check-macos:
          filters:
            tags:
              ignore: /^v.*/

      # Cross-platform coverage: Linux, Windows, macOS (1:1 with coverage.yml)
      - coverage-linux:
          filters:
            tags:
              ignore: /^v.*/
      - coverage-windows:
          filters:
            tags:
              ignore: /^v.*/
      - coverage-macos:
          filters:
            tags:
              ignore: /^v.*/

      # Linux-specific E2E Docker & TUN tests
      - proxy-throughput:
          filters:
            tags:
              ignore: /^v.*/
      - tun-benchmark:
          filters:
            tags:
              ignore: /^v.*/

  release-pipeline:
    unless: << pipeline.parameters.run_version_bump >>
    jobs:
      # All 15 Linux, FreeBSD, and Android targets from target.toml
      - build-linux:
          matrix:
            parameters:
              target_name:
                - "x86_64-unknown-linux-gnu"
                - "x86_64-unknown-linux-gnu-static-crt"
                - "i686-unknown-linux-gnu"
                - "x86_64-unknown-linux-musl"
                - "i686-unknown-linux-musl"
                - "aarch64-unknown-linux-gnu"
                - "aarch64-unknown-linux-musl"
                - "armv7-unknown-linux-gnueabi"
                - "armv7-unknown-linux-gnueabihf"
                - "armv7-unknown-linux-musleabihf"
                - "riscv64gc-unknown-linux-gnu"
                - "mips-unknown-linux-musl"
                - "mipsel-unknown-linux-musl"
                - "x86_64-unknown-freebsd"
                - "x86_64-linux-android"
          filters:
            tags:
              only: /^v.*/
            branches:
              only: master

      # All 6 Windows targets from target.toml
      - build-windows:
          matrix:
            parameters:
              target_name:
                - "x86_64-pc-windows-msvc"
                - "x86_64-pc-windows-msvc-static-crt"
                - "i686-pc-windows-msvc"
                - "i686-pc-windows-msvc-static-crt"
                - "aarch64-pc-windows-msvc"
                - "aarch64-pc-windows-msvc-static-crt"
          filters:
            tags:
              only: /^v.*/
            branches:
              only: master

      # All 4 macOS targets from target.toml
      - build-macos:
          matrix:
            parameters:
              target_name:
                - "x86_64-apple-darwin"
                - "x86_64-apple-darwin-static-crt"
                - "aarch64-apple-darwin"
                - "aarch64-apple-darwin-static-crt"
          filters:
            tags:
              only: /^v.*/
            branches:
              only: master

      # Release and Docker publishing
      - publish-release:
          requires:
            - build-linux
            - build-windows
            - build-macos
          filters:
            tags:
              only: /^v.*/
            branches:
              only: master

      - publish-docker:
          requires:
            - build-linux
          filters:
            tags:
              only: /^v.*/
            branches:
              only: master

  version-bump-workflow:
    when: << pipeline.parameters.run_version_bump >>
    jobs:
      - bump-version
